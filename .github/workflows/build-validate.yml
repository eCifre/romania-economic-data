name: Build and validate canonical export

on:
  push:
    branches: [main]
    paths:
      - "datasets/**"
      - "scripts/**"
      - "kaggle/dataset-metadata.json"
      - "huggingface/**"
  pull_request:
    paths:
      - "datasets/**"
      - "scripts/**"
      - "kaggle/dataset-metadata.json"
      - "huggingface/**"
  workflow_dispatch: {}

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Parquet dependency
        run: pip install pyarrow

      - name: Validate source datasets
        run: python3 scripts/validate_dataset.py

      - name: Build canonical consolidated export
        run: python3 scripts/build_canonical_dataset.py

      - name: Validate consolidated export
        run: python3 scripts/validate_dataset.py build/romania_economic_indicators.csv

      - name: Convert to Parquet
        run: python3 scripts/csv_to_parquet.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: romania_economic_indicators
          path: |
            build/romania_economic_indicators.csv
            build/romania_economic_indicators.parquet
